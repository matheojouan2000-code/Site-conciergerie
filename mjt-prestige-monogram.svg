<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="80%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5efe3"/>
    </radialGradient>
    <linearGradient id="gold" x1="20" y1="20" x2="180" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e9cf8f"/>
      <stop offset="50%" stop-color="#c69a4c"/>
      <stop offset="100%" stop-color="#9c7530"/>
    </linearGradient>
  </defs>

  <!-- disc -->
  <circle cx="100" cy="100" r="98" fill="url(#bg)"/>

  <!-- hairline rings -->
  <circle cx="100" cy="100" r="93" fill="none" stroke="url(#gold)" stroke-width="1.1"/>
  <circle cx="100" cy="100" r="87.5" fill="none" stroke="url(#gold)" stroke-width="0.5" opacity="0.5"/>

  <!-- single mark, top -->
  <path d="M100 34 L102.6 39.5 L108 42 L102.6 44.5 L100 50 L97.4 44.5 L92 42 L97.4 39.5 Z" fill="url(#gold)"/>

  <!-- monogram -->
  <text x="100" y="103" text-anchor="middle" font-family="'Fraunces','Playfair Display',Georgia,serif" font-size="46" font-weight="500" fill="url(#gold)" letter-spacing="3">MJT</text>

  <!-- thin rule -->
  <line x1="65" y1="124" x2="135" y2="124" stroke="url(#gold)" stroke-width="0.9"/>

  <!-- caption -->
  <text x="100" y="149" text-anchor="middle" font-family="'Inter','Plus Jakarta Sans',sans-serif" font-size="15" font-weight="600" letter-spacing="4" fill="#7a5b28">PRESTIGE</text>

  <!-- bottom mark -->
  <path d="M100 166 L102.6 171.5 L108 174 L102.6 176.5 L100 182 L97.4 176.5 L92 174 L97.4 171.5 Z" fill="url(#gold)" opacity="0.85"/>
</svg>
