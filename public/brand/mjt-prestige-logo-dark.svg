<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 160" fill="none">
  <defs>
    <radialGradient id="bg2" cx="50%" cy="35%" r="80%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5efe3"/>
    </radialGradient>
    <linearGradient id="gold2" x1="0" y1="0" x2="160" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e9cf8f"/>
      <stop offset="50%" stop-color="#c69a4c"/>
      <stop offset="100%" stop-color="#9c7530"/>
    </linearGradient>
  </defs>

  <!-- seal (médaillon clair, se détache sur fond sombre) -->
  <circle cx="80" cy="80" r="72" fill="url(#bg2)"/>
  <circle cx="80" cy="80" r="68" fill="none" stroke="url(#gold2)" stroke-width="1.1"/>
  <circle cx="80" cy="80" r="63.5" fill="none" stroke="url(#gold2)" stroke-width="0.5" opacity="0.5"/>
  <path d="M80 34 L82.2 38.8 L87 41 L82.2 43.2 L80 48 L77.8 43.2 L73 41 L77.8 38.8 Z" fill="url(#gold2)"/>
  <text x="80" y="93" text-anchor="middle" font-family="'Fraunces','Playfair Display',Georgia,serif" font-size="41" font-weight="500" fill="url(#gold2)" letter-spacing="2">MJT</text>
  <line x1="59" y1="108" x2="101" y2="108" stroke="url(#gold2)" stroke-width="0.8"/>

  <!-- vertical rule -->
  <line x1="172" y1="42" x2="172" y2="118" stroke="#8a7550" stroke-width="1" opacity="0.6"/>

  <!-- wordmark (for dark backgrounds) -->
  <text x="196" y="82" font-family="'Fraunces','Playfair Display',Georgia,serif" font-size="42" font-weight="500" fill="#faf8f3" letter-spacing="3">MJT</text>
  <text x="196" y="112" font-family="'Inter','Plus Jakarta Sans',sans-serif" font-size="16" font-weight="600" letter-spacing="7" fill="url(#gold2)">PRESTIGE</text>
</svg>
