<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 160" fill="none">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#423628"/>
      <stop offset="100%" stop-color="#211c16"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="160" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f3d68a"/>
      <stop offset="50%" stop-color="#cda856"/>
      <stop offset="100%" stop-color="#ab8639"/>
    </linearGradient>
    <linearGradient id="goldSoft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#cda856" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ab8639"/>
      <stop offset="100%" stop-color="#cda856" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- emblem -->
  <circle cx="80" cy="80" r="78" fill="url(#bg)"/>
  <circle cx="80" cy="80" r="76" fill="none" stroke="url(#gold)" stroke-width="1.6"/>
  <circle cx="80" cy="80" r="67" fill="none" stroke="url(#gold)" stroke-width="0.8" opacity="0.55"/>
  <g fill="none" stroke="url(#gold)" stroke-width="1.6" stroke-linecap="round">
    <path d="M30 100 C25 108 23 118 28 126"/>
    <path d="M28 103 C22 102 17 105 14 110"/>
    <path d="M30 110 C24 111 19 115 16 121"/>
    <path d="M33 117 C27 119 23 124 21 130"/>
  </g>
  <g fill="none" stroke="url(#gold)" stroke-width="1.6" stroke-linecap="round">
    <path d="M130 100 C135 108 137 118 132 126"/>
    <path d="M132 103 C138 102 143 105 146 110"/>
    <path d="M130 110 C136 111 141 115 144 121"/>
    <path d="M127 117 C133 119 137 124 139 130"/>
  </g>
  <text x="80" y="98" text-anchor="middle" font-family="'Fraunces','Playfair Display',Georgia,serif" font-size="68" font-weight="600" fill="url(#gold)" letter-spacing="-1.5">MJT</text>

  <!-- divider -->
  <rect x="178" y="34" width="1.5" height="92" fill="url(#goldSoft)"/>

  <!-- wordmark (for light backgrounds) -->
  <text x="204" y="78" font-family="'Fraunces','Playfair Display',Georgia,serif" font-size="50" font-weight="600" fill="#211c16" letter-spacing="0.5">MJT</text>
  <text x="204" y="112" font-family="'Inter','Plus Jakarta Sans',sans-serif" font-size="18" font-weight="600" letter-spacing="7" fill="#ab8639">PRESTIGE</text>
