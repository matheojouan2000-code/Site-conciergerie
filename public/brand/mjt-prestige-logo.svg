<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 160" fill="none">
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="80%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5efe3"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="160" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e9cf8f"/>
      <stop offset="50%" stop-color="#c69a4c"/>
      <stop offset="100%" stop-color="#9c7530"/>
    </linearGradient>
  </defs>

  <!-- seal -->
  <circle cx="80" cy="80" r="72" fill="url(#bg)"/>
  <circle cx="80" cy="80" r="68" fill="none" stroke="url(#gold)" stroke-width="1.1"/>
  <circle cx="80" cy="80" r="63.5" fill="none" stroke="url(#gold)" stroke-width="0.5" opacity="0.5"/>
  <path d="M80 34 L82.2 38.8 L87 41 L82.2 43.2 L80 48 L77.8 43.2 L73 41 L77.8 38.8 Z" fill="url(#gold)"/>
  <text x="80" y="93" text-anchor="middle" font-family="'Fraunces','Playfair Display',Georgia,serif" font-size="41" font-weight="500" fill="url(#gold)" letter-spacing="2">MJT</text>
  <line x1="59" y1="108" x2="101" y2="108" stroke="url(#gold)" stroke-width="0.8"/>

  <!-- vertical rule -->
  <line x1="172" y1="42" x2="172" y2="118" stroke="#e6d9c0" stroke-width="1"/>

  <!-- wordmark (for light backgrounds) -->
  <text x="196" y="82" font-family="'Fraunces','Playfair Display',Georgia,serif" font-size="42" font-weight="500" fill="#211c16" letter-spacing="3">MJT</text>
  <text x="196" y="112" font-family="'Inter','Plus Jakarta Sans',sans-serif" font-size="15" font-weight="500" letter-spacing="8" fill="#9c7530">PRESTIGE</text>
</svg>
